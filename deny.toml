[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "GPL-3.0-only",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
    { crate = "syn@2.0.119", reason = "derive_more-impl 2.1.1, strum_macros 0.28.0 and tracing-attributes 0.1.31 require syn 2; current Serde/Clap/Tokio derive macros require syn 3. Re-audit when either chain updates." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

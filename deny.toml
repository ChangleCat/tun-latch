[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "GPL-3.0-only",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# libproc's SDK binding generation uses these build dependencies. Limit the extra
# license approvals to the reviewed package versions rather than the whole graph.
exceptions = [
    { name = "bindgen", version = "=0.73.2", allow = ["BSD-3-Clause"] },
    { name = "libloading", version = "=0.8.9", allow = ["ISC"] },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
    { crate = "syn@2.0.119", reason = "derive_more-impl 2.1.1, strum_macros 0.28.0 and tracing-attributes 0.1.31 require syn 2; current Serde/Clap/Tokio derive macros require syn 3. Re-audit when either chain updates." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
